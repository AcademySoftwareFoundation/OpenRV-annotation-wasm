name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    if: github.repository_owner == 'AcademySoftwareFoundation'
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 3.1.50 # keep in sync with EMSDK_VERSION in Makefile

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Staged publishing requires npm >= 11.15.0.
      - name: Update npm
        run: npm install -g npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      # Authenticates via OIDC trusted publishing (no NPM_TOKEN secret). The
      # trusted publisher is stage-only: the release is uploaded to npm's stage
      # queue and only goes live once a maintainer approves it with 2FA.
      - name: Stage release
        run: make publish-stage
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Summary
        run: |
          PKG="$(node -p "require('./package.json').name")"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Staged \`${PKG}@${GITHUB_REF_NAME#v}\`

          Not live yet. Approve it on npmjs.com under the package's
          **Staged Packages** tab, or with \`npm stage list\` and
          \`npm stage approve <stage-id>\` (requires 2FA).
          EOF
